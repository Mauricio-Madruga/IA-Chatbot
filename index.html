<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual - Consulta de Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Asistente Virtual</h1>
            <p class="subtitle">Consulta especificaciones y precios de productos</p>
            <button id="kbStatus" class="kb-status-btn">📊 Estado KB</button>
        </div>
        
        <div id="chatContainer" class="chat-container"></div>
        
        <div class="input-container">
            <textarea id="messageInput" placeholder="Ej: ¿Cuál es mejor, iPhone 15 o Samsung S24?" rows="1"></textarea>
            <button id="sendButton" class="send-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
